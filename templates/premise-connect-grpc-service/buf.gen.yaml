version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
      - Mgreet/v1/greet.proto=example.com/premise-module/apps/premise-connect-grpc-service/gen/greet/v1
  - local: protoc-gen-connect-go
    out: gen
    opt:
      - paths=source_relative
      - Mgreet/v1/greet.proto=example.com/premise-module/apps/premise-connect-grpc-service/gen/greet/v1
