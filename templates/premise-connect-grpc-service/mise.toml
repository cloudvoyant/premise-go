[env]
GOWORK = "off"

[tools]
go = "1.25.14"
buf = "1.47.2"

[tasks."install"]
run = '''
set -eu
go mod download all
'''

[tasks."build"]
run = '''
set -eu
mkdir -p dist && go build -o dist/app .
'''

[tasks."clean"]
run = '''
set -eu
rm -rf dist
'''

[tasks."test"]
run = '''
set -eu
go test ./...
'''

[tasks."lint"]
run = '''
set -eu
go vet ./...
'''

[tasks."lint:fix"]
run = '''
set -eu
go fmt ./... && go vet ./...
'''

[tasks."format"]
run = '''
set -eu
gofmt -w $(find . -name '*.go' -not -path './sdk/*')
'''

[tasks."format:check"]
run = '''
set -eu
test -z "$(gofmt -l $(find . -name '*.go' -not -path './sdk/*'))"
'''

[tasks."env-pull"]
run = '''
set -eu
echo "No external environment configuration"
'''

[tasks."publish"]
run = '''
set -eu
go test ./... && echo "Packages share the workspace repository tag"
'''

[tasks."publish:rc"]
run = '''
set -eu
go test ./... && echo "Packages share the workspace repository RC tag"
'''

[tasks."run"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = 1 ]; then go test ./...; else go run .; fi
'''

[tasks."dev"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = 1 ]; then go test ./...; else go run .; fi
'''

[tasks."deploy"]
run = '''
set -eu
echo "Configure deployment for your environment; no cloud resources provisioned"
'''

[tasks."e2e"]
run = '''
set -eu
go test ./... -run "Test"
'''

[tasks.generate]
run = """
set -eu
mkdir -p .tools
GOBIN="$PWD/.tools" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
GOBIN="$PWD/.tools" go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.0
PATH="$PWD/.tools:$PATH" buf generate
"""
