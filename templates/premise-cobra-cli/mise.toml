[tools]
go = "1.25.14"

[tasks."install"]
run = '''
set -eu
go mod download
'''

[tasks."build"]
run = '''
set -eu
mkdir -p dist && go build -o dist/app .
'''

[tasks."clean"]
run = '''
set -eu
rm -rf dist
'''

[tasks."test"]
run = '''
set -eu
go test ./...
'''

[tasks."lint"]
run = '''
set -eu
go vet ./...
'''

[tasks."lint:fix"]
run = '''
set -eu
go fmt ./... && go vet ./...
'''

[tasks."format"]
run = '''
set -eu
gofmt -w $(find . -name '*.go' -not -path './sdk/*')
'''

[tasks."format:check"]
run = '''
set -eu
test -z "$(gofmt -l $(find . -name '*.go' -not -path './sdk/*'))"
'''

[tasks."env-pull"]
run = '''
set -eu
echo "No external environment configuration"
'''

[tasks."publish"]
run = '''
set -eu
go test ./... && echo "Module tags are published by the coordinated premise release"
'''

[tasks."publish:rc"]
run = '''
set -eu
go test ./... && echo "RC module tags are published by the coordinated premise release"
'''

[tasks."run"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = 1 ]; then go test ./...; else go run .; fi
'''

[tasks."dev"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = 1 ]; then go test ./...; else go run .; fi
'''

[tasks."deploy"]
run = '''
set -eu
echo "Configure deployment for your environment; no cloud resources provisioned"
'''

[tasks."e2e"]
run = '''
set -eu
go test ./... -run "Test"
'''
