[env]
GOWORK = "off"

[tools]
go = "1.25.14"
golangci-lint = "2.15.0"
pulumi = "3.200.0"
node = "22.22.0"

[tasks."install"]
run = "go mod download all"

[tasks."build"]
run = "go build -o dist/pulumi-resource-premise-pulumi-component-package ."

[tasks."clean"]
run = "rm -rf dist"

[tasks."test"]
depends = ["test:sdk"]
run = "go test ./..."

[tasks."lint"]
run = "golangci-lint run"

[tasks."lint:fix"]
run = "golangci-lint run --fix"

[tasks."format"]
run = "golangci-lint fmt"

[tasks."format:check"]
run = "golangci-lint fmt --diff"

[tasks."env-pull"]
run = "echo \"env-pull: nothing to pull\""

[tasks."publish"]
run = "go test ./..."

[tasks."publish:rc"]
run = "go test ./..."

[tasks.generate]
run = "sh scripts/generate.sh"

[tasks."test:sdk"]
dir = "sdk/nodejs"
run = ["npm ci --ignore-scripts --no-audit --no-fund", "npm run build", "node ../../examples/node-consumer.cjs"]
